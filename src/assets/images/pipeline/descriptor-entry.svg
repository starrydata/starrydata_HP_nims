  <path d="M96 50H108" stroke-dasharray="3 3" opacity=".65" stroke-width="1.4"/>
  <path d="M105 47l5 3-5 3" opacity=".65" stroke-width="1.4"/>

  <!-- 右：フォーム（Descriptor） -->
  <rect x="112" y="10" width="44" height="78" rx="3"/>
