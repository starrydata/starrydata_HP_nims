name: Sync to starrydata.github.io/hp/

# starrydata.nims.go.jp/hp/* (NIMS プロキシ) が指している
# starrydata.github.io/hp/ を自動同期する。
#
# 必要な設定:
#   - Secrets → Actions → PAGES_SYNC_TOKEN
#     (fine-grained PAT: starrydata/starrydata.github.io の Contents Read/Write のみ)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-links
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (starrydata_HP_nims)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with /hp/ prefix
        env:
          PATHPREFIX: "/hp/"
        run: npx eleventy --output=_site_hp

      - name: Checkout target (starrydata.github.io)
        uses: actions/checkout@v4
        with:
          repository: starrydata/starrydata.github.io
          token: ${{ secrets.PAGES_SYNC_TOKEN }}
          path: target

      - name: Replace hp/ contents / remove links/
        run: |
          rm -rf target/links
          rm -rf target/hp
          mkdir -p target/hp
          cp -R _site_hp/. target/hp/

      - name: Commit & push if changed
        run: |
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          SRC_SHA="${GITHUB_SHA::7}"
          git commit -m "Sync hp/ from starrydata_HP_nims @ ${SRC_SHA}"
          git push origin main
