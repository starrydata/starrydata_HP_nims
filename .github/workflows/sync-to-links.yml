name: Sync to starrydata.github.io/links/

# starrydata.nims.go.jp/ (NIMS プロキシ) が指している
# starrydata.github.io/links/ を新 HP の内容と自動同期する。
#
# 通常の GitHub Pages デプロイ (deploy.yml, /starrydata_HP_nims/ プレフィックス) は
# そのまま継続。本 workflow は追加で /links/ プレフィックスでビルドして
# 別 repo (starrydata/starrydata.github.io) の links/ サブディレクトリに push する。
#
# 必要な設定:
#   - Secrets → Actions → PAGES_SYNC_TOKEN
#     (fine-grained PAT: starrydata/starrydata.github.io の Contents Read/Write のみ)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-links
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (starrydata_HP_nims)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with /links/ prefix (NIMS プロキシは /links/ 以下しかルーティングしないため、HTML の絶対パスも /links/ プレフィックス必須)
        env:
          PATHPREFIX: "/links/"
        run: npx eleventy

      - name: Checkout target (starrydata.github.io)
        uses: actions/checkout@v4
        with:
          repository: starrydata/starrydata.github.io
          token: ${{ secrets.PAGES_SYNC_TOKEN }}
          path: target

      - name: Replace links/ contents (links_archive/ は温存)
        run: |
          rm -rf target/links
          mkdir -p target/links
          cp -R _site/. target/links/

      - name: Commit & push if changed
        run: |
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          SRC_SHA="${GITHUB_SHA::7}"
          git commit -m "Sync links/ from starrydata_HP_nims @ ${SRC_SHA}"
          git push origin main
